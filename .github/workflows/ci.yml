name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: schema/scripts/package-lock.json
      - run: make check-generated

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      # testcontainers uses the Docker daemon of the runner.
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm --workspace app run lint
      - run: npm --workspace app test
      - run: npx --workspace app tsc --noEmit
      # No patched release exists for these. braces is a DoS on glob patterns in the
      # metro and jest tooling. node-forge is used only for expo-updates code signing,
      # which the app does not use.
      - run: >-
          npx --yes audit-ci@7.1.0 --high
          --allowlist GHSA-vfj7-8cjw-p6xm GHSA-86w9-cpqp-85rv

  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: make e2e-stack-up
      - run: npx --workspace e2e playwright install --with-deps
      - run: make e2e-web
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/web/test-results/
          retention-days: 14
      - if: always()
        run: make e2e-stack-down

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, powersync, web, ai]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: money-tracker-${{ matrix.image }}:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: money-tracker-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
