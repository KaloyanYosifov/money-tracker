name: Claude CLI update

# Opens a PR when the stable Claude CLI version differs from the version in
# deploy/docker/ai.Dockerfile. Dependabot does not know this download.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update the version and the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=deploy/docker/ai.Dockerfile
          base=https://downloads.claude.ai/claude-code-releases
          latest=$(curl -fsSL "$base/stable")
          if [[ ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected version: $latest" >&2
            exit 1
          fi
          current=$(sed -n 's/^ARG CLAUDE_VERSION=//p' "$file")
          if [ "$latest" = "$current" ]; then
            echo "Claude CLI $current is current."
            exit 0
          fi
          branch="claude-cli/$latest"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch exists already."
            exit 0
          fi
          manifest=$(curl -fsSL "$base/$latest/manifest.json")
          amd64=$(jq -er '.platforms["linux-x64"].checksum' <<<"$manifest")
          arm64=$(jq -er '.platforms["linux-arm64"].checksum' <<<"$manifest")
          sed -i \
            -e "s/^ARG CLAUDE_VERSION=.*/ARG CLAUDE_VERSION=$latest/" \
            -e "s/^ARG CLAUDE_SHA256_AMD64=.*/ARG CLAUDE_SHA256_AMD64=$amd64/" \
            -e "s/^ARG CLAUDE_SHA256_ARM64=.*/ARG CLAUDE_SHA256_ARM64=$arm64/" \
            "$file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update Claude CLI to $latest"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update Claude CLI to $latest" \
            --body "Updates the Claude CLI in the AI gateway image from $current to $latest. The checksums come from $base/$latest/manifest.json. Check that the gateway still works with the new CLI before you merge."
