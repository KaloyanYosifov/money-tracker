name: iOS e2e

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-e2e:
    # The runner setup is in docs/operations.md.
    runs-on: [self-hosted, macOS, money-tracker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: make stack-up
      - run: npm --workspace e2e run test:ios
      # The cross scenarios drive the web app in Playwright Chromium.
      - run: npx --workspace e2e playwright install chromium
      - run: npm --workspace e2e run test:cross
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-artifacts
          path: ~/.maestro/tests/
          retention-days: 14
      - if: always()
        run: make stack-down
