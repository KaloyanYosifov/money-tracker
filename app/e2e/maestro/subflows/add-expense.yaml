# Adds an expense from the Spending tab.
# Env: NAME, AMOUNT (the amount in euro, for example "4" or "12.50"), CATEGORY.
appId: com.kyosifov.moneytracker
---
- tapOn:
    id: tab-spending
- tapOn:
    id: add-expense
- extendedWaitUntil:
    visible:
      text: New Expense
    timeout: 10000
# A new expense opens with the amount field in focus.
- tapOn:
    id: transaction-amount
- inputText: ${AMOUNT}
- tapOn:
    id: transaction-name
- inputText: ${NAME}
# No keyboard shows when the simulator uses the Mac keyboard, so this step may do nothing.
- hideKeyboard:
    optional: true
- tapOn:
    id: transaction-category
- scrollUntilVisible:
    element:
      id: category-option-${CATEGORY}
    direction: DOWN
- tapOn:
    id: category-option-${CATEGORY}
- tapOn:
    id: transaction-save
- extendedWaitUntil:
    notVisible:
      id: transaction-save
    timeout: 10000
