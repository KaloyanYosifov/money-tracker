# Logs in with password and TOTP from a clean install.
# Env: EMAIL, PASSWORD, TOTP_CODE. e2e/ios/run.ts makes the code right before the flow starts.
appId: com.kyosifov.moneytracker
name: Log in with password and TOTP
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- tapOn:
    id: login-email
- inputText: ${EMAIL}
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
# No keyboard shows when the simulator uses the Mac keyboard, so this step may do nothing.
- hideKeyboard:
    optional: true
- tapOn:
    id: login-submit
# iOS offers to save the password once the login form goes. The sheet covers the app and can
# come before or after the TOTP screen shows, so close it on both sides of that step.
- extendedWaitUntil:
    visible: Not Now
    timeout: 8000
    optional: true
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible:
      id: totp-code
    timeout: 15000
- tapOn:
    text: Not Now
    optional: true
- tapOn:
    id: totp-code
- inputText: ${TOTP_CODE}
- extendedWaitUntil:
    visible:
      id: tab-spending
    timeout: 30000
- assertVisible:
    id: add-expense
# The first download must finish, so that the categories and accounts exist on the device.
- runFlow:
    file: subflows/check-sync-state.yaml
    env:
      STATE: Synced.* · 0 pending
