# Logs in with password and TOTP from a clean install.
# Env: EMAIL, PASSWORD, TOTP_CODE. e2e/ios/run.ts makes the code right before the flow starts.
appId: com.kyosifov.moneytracker
name: Log in with password and TOTP
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- tapOn:
    id: login-email
- inputText: ${EMAIL}
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
# Return in the password field logs in. A tap on "Log in" can miss when the iPad keyboard covers it.
- pressKey: Enter
# Wait until the login form is gone. The TOTP screen replaces it, but on the iPad the floating number
# pad of the focused code field hides the app from Maestro, so wait for the form to go, not for the
# TOTP screen. The code field keeps the focus, so inputText still goes into it.
- extendedWaitUntil:
    notVisible:
      id: login-email
    timeout: 15000
# e2e/ios/run.ts turns off password AutoFill, so iOS shows no "Save Password?" sheet. This tap is a fallback.
- tapOn:
    text: Not Now
    optional: true
- tapOn:
    id: totp-code
    optional: true
- inputText: ${TOTP_CODE}
- extendedWaitUntil:
    visible:
      id: tab-spending
    timeout: 30000
- assertVisible:
    id: add-expense
# The first download must finish, so that the categories and accounts exist on the device.
- runFlow:
    file: subflows/check-sync-state.yaml
    env:
      STATE: Synced.* · 0 pending
